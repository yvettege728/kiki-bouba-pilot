<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiki Bouba Pilot</title>
<style>
  html, body { margin: 0; height: 100%; background: #808080; overflow: hidden;
    font-family: -apple-system, Helvetica, Arial, sans-serif; color: #111; }
  body.running { cursor: none; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  #ui:empty { display: none; }
  .card { max-width: 640px; padding: 32px; font-size: 20px; line-height: 1.55; }
  .card h1 { font-size: 32px; margin: 0 0 12px; }
  button { font-size: 18px; padding: 10px 20px; margin: 8px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  input { font-size: 18px; padding: 8px; width: 220px; border-radius: 6px; border: 1px solid #444; }
  kbd { background: #eee; border-radius: 4px; padding: 1px 7px; font-family: inherit; }
  .small { font-size: 15px; opacity: .75; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
// ---------- Config ----------
const CFG = {
  fixMs: 800,          // fixation cross before every trial
  blankMs: 500,        // inter-trial blank
  timeoutMs: 10000,    // max time per trial
  dotMs: 1500,         // time per follow-the-dot target
  practice: 2,
  reps: { easy: 6, medium: 6, hard: 8 },
};

// ---------- Setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ui = document.getElementById('ui');
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

const log = [];
let pid = '', t0 = 0, aborted = false;
const now = () => performance.now();
function rec(o) {
  log.push(Object.assign({ pid, t_ms: +(now() - t0).toFixed(1), wall: new Date().toISOString() }, o));
  try { localStorage.setItem('kb_backup_' + pid, JSON.stringify(log)); } catch (e) {}
}
const rand = (a, b) => a + Math.random() * (b - a);
const wait = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function clear() { ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H); }
// Sync patch (bottom-left): white while a stimulus is on screen. Point a photodiode
// or the screen recording at it to align tracker data with trial onsets.
function sync(on) { ctx.fillStyle = on ? '#fff' : '#000'; ctx.fillRect(0, H - 40, 40, 40); }
function cross() {
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(W / 2 - 15, H / 2); ctx.lineTo(W / 2 + 15, H / 2);
  ctx.moveTo(W / 2, H / 2 - 15); ctx.lineTo(W / 2, H / 2 + 15); ctx.stroke();
}
function text(s, x, y, size = 22) {
  ctx.fillStyle = '#111'; ctx.font = `${size}px -apple-system, Helvetica, Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---------- Parametric shapes ----------
const TAU = Math.PI * 2, N = 720;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function radial(fn) { const r = []; for (let i = 0; i < N; i++) r.push(fn(i / N * TAU)); return r; }

// m = 0 is fully round (bouba), m = 1 is fully spiky (kiki)
function morph(m, k, ph) {
  return radial(t => {
    const round = 1 + 0.12 * Math.sin(k * t + ph);
    const p = (((k * t + ph) / TAU) % 1 + 1) % 1;
    const spiky = 1 + 0.32 * (1 - 4 * Math.abs(p - 0.5));
    return (1 - m) * round + m * spiky;
  });
}
// Round blob with one local feature at featAng: a sharp spike (target) or a
// smooth bump of the same height (distractor). Telling them apart needs foveal inspection.
function blob(ph, k, featAng, sharp) {
  return radial(t => {
    const d = Math.abs(angDiff(t, featAng));
    const f = sharp ? 0.38 * Math.max(0, 1 - d / 0.13) : 0.38 * Math.exp(-((d / 0.17) ** 2));
    return 1 + 0.08 * Math.sin(k * t + ph) + f;
  });
}
// Scale so every shape has the same area (equivalent radius = size px)
function toPts(r, cx, cy, size) {
  let a = 0; for (const x of r) a += x * x; a *= 0.5 * (TAU / N);
  const s = size / Math.sqrt(a / Math.PI);
  return r.map((x, i) => [cx + Math.cos(i / N * TAU) * x * s, cy + Math.sin(i / N * TAU) * x * s]);
}
function drawShape(pts) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath(); ctx.fillStyle = '#111'; ctx.fill();
}
function bbox(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return [Math.round(x0), Math.round(y0), Math.round(x1 - x0), Math.round(y1 - y0)];
}

// ---------- Input ----------
function waitKey(keys, timeout) {
  return new Promise(res => {
    let done = false;
    const h = e => {
      const k = e.key.toLowerCase();
      if (k === 'escape') { aborted = true; finish(null); return; }
      if (keys.includes(k)) finish(k);
    };
    const to = timeout ? setTimeout(() => finish(null), timeout) : null;
    function finish(k) { if (done) return; done = true; removeEventListener('keydown', h); if (to) clearTimeout(to); res({ key: k, t: now() }); }
    addEventListener('keydown', h);
  });
}
function screen(html) {
  ui.innerHTML = `<div class="card">${html}<p class="small">Press <kbd>Space</kbd> to continue</p></div>`;
  document.body.classList.remove('running');
  return waitKey([' ']).then(() => { ui.innerHTML = ''; document.body.classList.add('running'); });
}

// ---------- Phase 1: follow the dot ----------
async function followDot() {
  resize();
  const pos = [];
  for (const fy of [0.1, 0.5, 0.9]) for (const fx of [0.1, 0.5, 0.9]) pos.push([fx, fy]);
  shuffle(pos);
  for (let i = 0; i < pos.length && !aborted; i++) {
    const x = pos[i][0] * W, y = pos[i][1] * H;
    rec({ event: 'dot_on', trial: i, block: 'dot', stim: JSON.stringify({ x: Math.round(x), y: Math.round(y) }) });
    const start = now();
    while (now() - start < CFG.dotMs) {
      const p = (now() - start) / CFG.dotMs;
      clear(); sync(true);
      ctx.fillStyle = '#c00'; ctx.beginPath(); ctx.arc(x, y, 18 - 12 * p, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill();
      await new Promise(requestAnimationFrame);
    }
    rec({ event: 'dot_off', trial: i, block: 'dot' });
  }
  clear(); sync(false);
}

// ---------- Phase 2: kiki/bouba trials ----------
function makeBlock(block, n) {
  const nPos = block === 'hard' ? 4 : 2;
  const T = [];
  for (let i = 0; i < n; i++) T.push({ block, targetPos: i % nPos }); // counterbalanced positions
  return shuffle(T);
}

async function runTrial(tr, idx) {
  resize();
  clear(); sync(false); cross();
  rec({ event: 'fixation', trial: idx, block: tr.block });
  await wait(CFG.fixMs);

  const n = tr.block === 'hard' ? 4 : 2;
  const keys = n === 4 ? ['d', 'f', 'j', 'k'] : ['f', 'j'];
  const size = Math.min(W / (n + 1) * 0.36, H * 0.2);
  const cy = H / 2;
  const shapes = [];
  clear();
  for (let i = 0; i < n; i++) {
    const cx = W * (i + 1) / (n + 1);
    const isT = i === tr.targetPos, ph = rand(0, TAU);
    let r, aoi;
    if (tr.block === 'hard') {
      const fa = rand(0, TAU);
      r = blob(ph, 5, fa, isT);
      const pts = toPts(r, cx, cy, size);
      const tip = pts[Math.round(fa / TAU * N) % N], a = size * 0.35;
      aoi = [Math.round(tip[0] - a), Math.round(tip[1] - a), Math.round(2 * a), Math.round(2 * a)];
      drawShape(pts);
      shapes.push({ pos: i, target: isT, feature: isT ? 'spike' : 'bump', cx: Math.round(cx), cy: Math.round(cy), bbox: bbox(pts), aoi });
    } else {
      const m = tr.block === 'medium' ? (isT ? 0.65 : 0.35) : (isT ? 1 : 0);
      const pts = toPts(morph(m, 8, ph), cx, cy, size);
      drawShape(pts);
      const b = bbox(pts);
      shapes.push({ pos: i, target: isT, spikiness: m, cx: Math.round(cx), cy: Math.round(cy), bbox: b, aoi: b });
    }
    text(keys[i].toUpperCase(), cx, cy + size * 1.9, 20);
  }
  text('Which one is KIKI?', W / 2, H * 0.12, 26);
  sync(true);
  const onset = now();
  rec({ event: 'stim_on', trial: idx, block: tr.block, n, target_pos: tr.targetPos, stim: JSON.stringify(shapes) });

  const resp = await waitKey(keys, CFG.timeoutMs);
  const rp = resp.key ? keys.indexOf(resp.key) : -1;
  const correct = rp === tr.targetPos;
  rec({ event: 'response', trial: idx, block: tr.block, n, target_pos: tr.targetPos,
        key: resp.key || 'timeout', resp_pos: rp, correct: correct ? 1 : 0, rt_ms: +(resp.t - onset).toFixed(1) });

  clear(); sync(false);
  if (tr.block === 'practice') { text(correct ? 'Correct' : 'Not quite', W / 2, H / 2, 28); await wait(800); clear(); sync(false); }
  await wait(CFG.blankMs);
  return { correct, rt: resp.t - onset, timeout: !resp.key };
}

// ---------- Flow ----------
async function main() {
  t0 = now();
  rec({ event: 'session_start', stim: JSON.stringify({ W, H, dpr: devicePixelRatio, ua: navigator.userAgent }) });

  await screen(`<h1>Warm-up</h1>A red dot will jump around the screen.<br>Just <b>follow it with your eyes</b>. Keep your head still.`);
  await followDot();

  const blocks = [
    ['practice', makeBlock('easy', CFG.practice).map(t => ({ ...t, block: 'practice' })),
      `<h1>Kiki or Bouba?</h1>One of these shapes is called <b>kiki</b>, the other <b>bouba</b>.<br>Find <b>kiki</b> and press the key under it.<br><kbd>F</kbd> = left, <kbd>J</kbd> = right.<br>Look at the <b>cross</b> whenever it appears.<br><br>First, two practice rounds.`],
    ['easy', makeBlock('easy', CFG.reps.easy), `<h1>Round 1</h1>Same task. No more feedback from here on.<br><kbd>F</kbd> = left, <kbd>J</kbd> = right.`],
    ['medium', makeBlock('medium', CFG.reps.medium), `<h1>Round 2</h1>The shapes get harder to tell apart.<br><kbd>F</kbd> = left, <kbd>J</kbd> = right.`],
    ['hard', makeBlock('hard', CFG.reps.hard), `<h1>Round 3</h1>Now four shapes. Only <b>one</b> has a sharp point.<br>Find it and press <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> or <kbd>K</kbd>.`],
  ];
  const results = [];
  let idx = 0;
  for (const [name, trials, intro] of blocks) {
    if (aborted) break;
    await screen(intro);
    rec({ event: 'block_start', block: name });
    for (const tr of trials) { if (aborted) break; const r = await runTrial(tr, idx++); if (name !== 'practice') results.push({ ...r, block: name }); }
  }
  rec({ event: aborted ? 'session_aborted' : 'session_end' });
  end(results);
}

function end(results) {
  document.body.classList.remove('running'); clear();
  const by = b => results.filter(r => r.block === b && !r.timeout);
  const row = b => { const r = by(b); if (!r.length) return `<tr><td>${b}</td><td colspan=2>no data</td></tr>`;
    const acc = Math.round(100 * r.filter(x => x.correct).length / r.length);
    const rt = Math.round(r.reduce((s, x) => s + x.rt, 0) / r.length);
    return `<tr><td>${b}</td><td>${acc}%</td><td>${rt} ms</td></tr>`; };
  ui.innerHTML = `<div class="card"><h1>${aborted ? 'Stopped' : 'Done, thank you!'}</h1>
    <table style="margin:0 auto 16px;border-spacing:18px 4px"><tr><th>Round</th><th>Accuracy</th><th>Mean RT</th></tr>
    ${row('easy')}${row('medium')}${row('hard')}</table>
    <button id="csv">Download CSV</button><button id="json">Download JSON</button>
    <p class="small">Data is also backed up in this browser under key kb_backup_${pid}.</p></div>`;
  document.getElementById('csv').onclick = () => download('csv');
  document.getElementById('json').onclick = () => download('json');
}

function download(kind) {
  const cols = ['pid', 't_ms', 'wall', 'event', 'trial', 'block', 'n', 'target_pos', 'key', 'resp_pos', 'correct', 'rt_ms', 'stim'];
  const esc = v => v == null ? '' : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const body = kind === 'csv'
    ? [cols.join(','), ...log.map(r => cols.map(c => esc(r[c])).join(','))].join('\n')
    : JSON.stringify(log, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: kind === 'csv' ? 'text/csv' : 'application/json' }));
  a.download = `kikibouba_${pid}_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.${kind}`;
  a.click();
}

// ---------- Start screen ----------
clear();
ui.innerHTML = `<div class="card"><h1>Kiki / Bouba eye-tracking pilot</h1>
  <p>Run calibration in the tracker software first.<br>Sit about 60 cm from the screen.</p>
  <p><input id="pid" placeholder="Participant ID (e.g. P01)"></p>
  <button id="go">Start (full screen)</button>
  <p class="small"><kbd>Esc</kbd> at any time stops the session and still lets you save data.</p></div>`;
document.getElementById('go').onclick = async () => {
  pid = document.getElementById('pid').value.trim() || 'anon';
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  await wait(400); resize(); ui.innerHTML = ''; main();
};
</script>
</body>
</html>
